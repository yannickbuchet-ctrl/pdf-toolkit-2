# Construction de l'exécutable sur GitHub, signature par SignPath et publication.
#
# - Lancement manuel (onglet Actions → « Run workflow ») : construit l'exécutable, disponible dans les artefacts.
# - Étiquette « v* » (par exemple v1.1) : construit, signe et publie l'exécutable dans une Release.
#
# Signature : SignPath Foundation (gratuite pour les logiciels libres). Elle s'active dès que le secret
# SIGNPATH_API_TOKEN et la variable SIGNPATH_ORGANIZATION_ID sont renseignés dans les réglages du dépôt
# (Settings → Secrets and variables → Actions) ; d'ici là, l'exécutable est construit sans signature.

name: Construction

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # publier la Release

env:
  EXE: PDF-Toolkit-2.exe
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

jobs:
  construire:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Installer les outils de construction
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Construire l'exécutable portable
        run: |
          python -m PyInstaller --clean --noconfirm "PDF Toolkit 2.spec"
          New-Item -ItemType Directory -Force livraison | Out-Null
          Copy-Item "dist\PDF Toolkit 2.exe" "livraison\$env:EXE"

      - name: Construire l'installateur (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          $env:CONSTRUCTION = "dossier"
          python -m PyInstaller --clean --noconfirm "PDF Toolkit 2.spec"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "installer\PDF Toolkit 2.iss"
          Copy-Item "dist\PDF-Toolkit-2-Installation-*.exe" livraison

      - name: Mettre de côté les exécutables (non signés)
        id: non-signe
        uses: actions/upload-artifact@v4
        with:
          name: non-signe
          path: livraison/*.exe

      - name: Signer avec SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: pdf-toolkit-2
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.non-signe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signe

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dossier = if (Test-Path "signe\$env:EXE") { "signe" } else { "livraison" }
          $installateur = (Get-ChildItem "$dossier\PDF-Toolkit-2-Installation-*.exe").FullName
          gh release create "$env:GITHUB_REF_NAME" `
            "$installateur#Installateur PDF Toolkit 2 (Windows, recommandé)" `
            "$dossier\$env:EXE#PDF Toolkit 2.exe (portable, sans installation)" `
            --title "PDF Toolkit 2 — $($env:GITHUB_REF_NAME.TrimStart('v'))" --generate-notes
